<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全力睡眠 — チーム睡眠管理</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #0a0e1a;
    --night-2: #111827;
    --night-3: #1c2535;
    --night-4: #253047;
    --moon: #c8d8f8;
    --moon-2: #8fa8e8;
    --sun: #f5c842;
    --sun-2: #ff9a3c;
    --red: #ff4d6d;
    --blue: #4facfe;
    --green: #43e97b;
    --text: #e8edf8;
    --text-2: #8fa8c8;
    --border: rgba(200,216,248,0.1);
    --radius: 16px;
    --radius-sm: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: var(--night);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Stars background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 20% 15%, rgba(255,255,255,0.6) 0%, transparent 100%),
      radial-gradient(1px 1px at 80% 25%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 50% 50%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 30% 75%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 70% 85%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 10% 60%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 90% 70%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 45% 30%, rgba(255,255,255,0.6) 0%, transparent 100%);
    pointer-events: none;
    z-index: 0;
  }

  #app { position: relative; z-index: 1; }

  /* ===== AUTH SCREEN ===== */
  #auth-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 2rem 1.5rem;
  }
  .auth-logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 3.5rem;
    letter-spacing: 0.05em;
    background: linear-gradient(135deg, var(--moon), var(--sun));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 0.25rem;
  }
  .auth-tagline {
    font-size: 0.85rem;
    color: var(--text-2);
    margin-bottom: 2.5rem;
    letter-spacing: 0.05em;
  }
  .auth-card {
    background: var(--night-2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 2rem;
    width: 100%;
    max-width: 400px;
  }
  .auth-tabs {
    display: flex;
    gap: 0;
    background: var(--night-3);
    border-radius: var(--radius-sm);
    padding: 4px;
    margin-bottom: 1.5rem;
  }
  .auth-tab {
    flex: 1;
    padding: 0.5rem;
    border: none;
    background: transparent;
    color: var(--text-2);
    font-family: inherit;
    font-size: 0.9rem;
    border-radius: 7px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .auth-tab.active {
    background: var(--night-4);
    color: var(--moon);
    font-weight: 700;
  }
  .form-group { margin-bottom: 1rem; }
  .form-label {
    display: block;
    font-size: 0.8rem;
    color: var(--text-2);
    margin-bottom: 0.4rem;
    letter-spacing: 0.05em;
  }
  .form-input {
    width: 100%;
    padding: 0.75rem 1rem;
    background: var(--night-3);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: inherit;
    font-size: 1rem;
    outline: none;
    transition: border-color 0.2s;
  }
  .form-input:focus { border-color: var(--moon-2); }
  .btn-primary {
    width: 100%;
    padding: 0.85rem;
    background: linear-gradient(135deg, #3a7bd5, #5a6fd6);
    border: none;
    border-radius: var(--radius-sm);
    color: white;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
    margin-top: 0.5rem;
  }
  .btn-primary:hover { opacity: 0.9; }
  .btn-primary:active { transform: scale(0.98); }
  .auth-error {
    color: var(--red);
    font-size: 0.85rem;
    margin-top: 0.75rem;
    text-align: center;
    display: none;
  }

  /* ===== MAIN APP ===== */
  #main-screen { display: none; }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1.25rem 1.5rem;
    border-bottom: 1px solid var(--border);
    background: rgba(10,14,26,0.8);
    backdrop-filter: blur(10px);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.6rem;
    letter-spacing: 0.05em;
    background: linear-gradient(135deg, var(--moon), var(--sun));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .header-user {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }
  .user-avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--night-3), var(--night-4));
    border: 1px solid var(--moon-2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--moon);
  }
  .btn-logout {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-2);
    font-family: inherit;
    font-size: 0.8rem;
    padding: 0.4rem 0.75rem;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-logout:hover { border-color: var(--text-2); color: var(--text); }

  .tabs-nav {
    display: flex;
    border-bottom: 1px solid var(--border);
    background: var(--night);
    position: sticky;
    top: 65px;
    z-index: 99;
  }
  .tab-btn {
    flex: 1;
    padding: 0.85rem;
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--text-2);
    font-family: inherit;
    font-size: 0.85rem;
    cursor: pointer;
    transition: all 0.2s;
  }
  .tab-btn.active {
    color: var(--moon);
    border-bottom-color: var(--moon);
  }

  .tab-content { display: none; padding: 1.5rem; }
  .tab-content.active { display: block; }

  /* ===== REPORT TAB ===== */
  .time-display {
    text-align: center;
    margin-bottom: 2rem;
  }
  .current-time {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 4rem;
    letter-spacing: 0.05em;
    color: var(--moon);
    line-height: 1;
  }
  .current-date {
    font-size: 0.85rem;
    color: var(--text-2);
    margin-top: 0.25rem;
  }

  /* The big button */
  .report-btn-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin: 1.5rem 0 2rem;
  }
  .report-btn {
    width: 200px;
    height: 200px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    transition: transform 0.15s, box-shadow 0.3s;
    position: relative;
    overflow: hidden;
  }
  .report-btn:active { transform: scale(0.94); }
  .report-btn.night-mode {
    background: radial-gradient(circle at 40% 40%, #1e3a6e, #0a1628);
    box-shadow: 0 0 40px rgba(100,160,255,0.3), 0 0 80px rgba(100,160,255,0.1), inset 0 0 30px rgba(255,255,255,0.05);
  }
  .report-btn.day-mode {
    background: radial-gradient(circle at 40% 40%, #f5a623, #e05b00);
    box-shadow: 0 0 40px rgba(245,168,35,0.4), 0 0 80px rgba(245,168,35,0.2), inset 0 0 30px rgba(255,255,255,0.1);
  }
  .report-btn:hover.night-mode { box-shadow: 0 0 60px rgba(100,160,255,0.5), 0 0 100px rgba(100,160,255,0.2); }
  .report-btn:hover.day-mode { box-shadow: 0 0 60px rgba(245,168,35,0.6), 0 0 100px rgba(245,168,35,0.3); }
  .btn-icon { font-size: 3.5rem; line-height: 1; }
  .btn-label {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.4rem;
    letter-spacing: 0.1em;
    color: white;
  }
  .btn-sublabel { font-size: 0.75rem; color: rgba(255,255,255,0.7); }

  .report-result {
    text-align: center;
    padding: 1rem 1.5rem;
    border-radius: var(--radius);
    font-size: 1.1rem;
    font-weight: 700;
    display: none;
    animation: fadeIn 0.4s ease;
  }
  .report-result.success {
    background: rgba(67,233,123,0.1);
    border: 1px solid rgba(67,233,123,0.3);
    color: var(--green);
  }
  .report-result.late {
    background: rgba(79,172,254,0.1);
    border: 1px solid rgba(79,172,254,0.3);
    color: var(--blue);
  }

  /* ===== GOAL SETTINGS ===== */
  .settings-card {
    background: var(--night-2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.5rem;
    margin-bottom: 1rem;
  }
  .settings-title {
    font-size: 0.8rem;
    color: var(--text-2);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 1rem;
  }
  .time-row {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-bottom: 1rem;
  }
  .time-icon { font-size: 1.5rem; }
  .time-label { flex: 1; font-size: 0.95rem; }
  .time-input {
    padding: 0.5rem 0.75rem;
    background: var(--night-3);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: inherit;
    font-size: 1rem;
    outline: none;
    width: 120px;
  }
  .time-input:focus { border-color: var(--moon-2); }
  .display-name-row { margin-bottom: 1rem; }
  .btn-save {
    padding: 0.75rem 1.5rem;
    background: linear-gradient(135deg, #0f4c81, #1a6bb5);
    border: none;
    border-radius: var(--radius-sm);
    color: white;
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .btn-save:hover { opacity: 0.85; }
  .save-msg {
    font-size: 0.85rem;
    color: var(--green);
    margin-left: 1rem;
    display: none;
  }

  /* ===== TIMELINE ===== */
  .timeline-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1.25rem;
  }
  .timeline-title {
    font-size: 1rem;
    font-weight: 700;
    color: var(--moon);
  }
  .timeline-subtitle {
    font-size: 0.8rem;
    color: var(--text-2);
    margin-top: 0.25rem;
  }
  .live-badge {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.75rem;
    color: var(--green);
    background: rgba(67,233,123,0.1);
    padding: 0.3rem 0.65rem;
    border-radius: 20px;
    border: 1px solid rgba(67,233,123,0.2);
  }
  .live-dot {
    width: 6px;
    height: 6px;
    background: var(--green);
    border-radius: 50%;
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .status-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 0.75rem;
  }
  .status-card {
    background: var(--night-2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1rem;
    animation: slideIn 0.35s ease;
  }
  .status-card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 0.85rem;
    gap: 0.75rem;
  }
  .status-user {
    font-size: 0.95rem;
    font-weight: 700;
  }
  .status-chip {
    font-size: 0.72rem;
    font-weight: 700;
    border-radius: 999px;
    padding: 0.3rem 0.65rem;
    border: 1px solid transparent;
    white-space: nowrap;
  }
  .status-chip.sleeping {
    color: var(--moon);
    background: rgba(143,168,232,0.15);
    border-color: rgba(143,168,232,0.35);
  }
  .status-chip.awake {
    color: var(--sun);
    background: rgba(245,200,66,0.15);
    border-color: rgba(245,200,66,0.35);
  }
  .status-chip.unknown {
    color: var(--text-2);
    background: rgba(143,168,200,0.12);
    border-color: rgba(143,168,200,0.3);
  }
  .status-meta {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 0.5rem;
  }
  .status-event {
    font-size: 0.78rem;
    color: var(--text-2);
  }
  .status-time {
    font-family: 'Bebas Neue', sans-serif;
    letter-spacing: 0.04em;
    font-size: 1.4rem;
    line-height: 1;
    color: var(--text);
  }
  .status-card.sleeping .status-time { color: var(--moon); }
  .status-card.awake .status-time { color: var(--sun); }
  .status-card.unknown .status-time { color: var(--text-2); }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  .empty-timeline {
    text-align: center;
    padding: 3rem 1rem;
    color: var(--text-2);
    font-size: 0.9rem;
  }
  .empty-timeline .big { font-size: 2.5rem; margin-bottom: 0.5rem; }

  /* Loading */
  .loading {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3rem;
    color: var(--text-2);
    font-size: 0.9rem;
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--night-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 0.75rem 1.25rem;
    font-size: 0.9rem;
    color: var(--text);
    opacity: 0;
    transition: all 0.3s;
    z-index: 999;
    white-space: nowrap;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  @media (max-width: 480px) {
    .report-btn { width: 170px; height: 170px; }
    .current-time { font-size: 3rem; }
  }
</style>
</head>
<body>

<div id="app">
  <!-- AUTH SCREEN -->
  <div id="auth-screen">
    <div class="auth-logo">全力睡眠</div>
    <div class="auth-tagline">チームで作る最強の睡眠習慣</div>
    <div class="auth-card">
      <div class="auth-tabs">
        <button class="auth-tab active" id="tab-login" onclick="switchAuthTab('login')">ログイン</button>
        <button class="auth-tab" id="tab-register" onclick="switchAuthTab('register')">新規登録</button>
      </div>
      <div id="login-form">
        <div class="form-group">
          <label class="form-label">メールアドレス</label>
          <input class="form-input" type="email" id="login-email" placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label class="form-label">パスワード</label>
          <input class="form-input" type="password" id="login-password" placeholder="••••••••">
        </div>
        <button class="btn-primary" onclick="handleLogin()">ログイン →</button>
      </div>
      <div id="register-form" style="display:none">
        <div class="form-group">
          <label class="form-label">表示名（部活での名前）</label>
          <input class="form-input" type="text" id="reg-name" placeholder="例：田中">
        </div>
        <div class="form-group">
          <label class="form-label">メールアドレス</label>
          <input class="form-input" type="email" id="reg-email" placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label class="form-label">パスワード（6文字以上）</label>
          <input class="form-input" type="password" id="reg-password" placeholder="••••••••">
        </div>
        <button class="btn-primary" onclick="handleRegister()">登録して始める →</button>
      </div>
      <div class="auth-error" id="auth-error"></div>
    </div>
  </div>

  <!-- MAIN APP -->
  <div id="main-screen">
    <div class="header">
      <div class="header-logo">全力睡眠</div>
      <div class="header-user">
        <div class="user-avatar" id="user-avatar">？</div>
        <span id="user-name-display" style="font-size:0.9rem;color:var(--text-2)"></span>
        <button class="btn-logout" onclick="handleLogout()">ログアウト</button>
      </div>
    </div>

    <div class="tabs-nav">
      <button class="tab-btn active" onclick="switchTab('report')">📋 報告</button>
      <button class="tab-btn" onclick="switchTab('timeline')">👥 タイムライン</button>
      <button class="tab-btn" onclick="switchTab('settings')">⚙️ 設定</button>
    </div>

    <!-- REPORT TAB -->
    <div class="tab-content active" id="tab-report">
      <div class="time-display">
        <div class="current-time" id="clock">00:00</div>
        <div class="current-date" id="date-display"></div>
      </div>
      <div class="settings-card" style="margin-bottom:1rem">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span style="font-size:0.85rem;color:var(--text-2)">🌙 目標就寝</span>
          <span style="font-weight:700" id="goal-sleep-display">未設定</span>
          <span style="font-size:0.85rem;color:var(--text-2)">☀️ 目標起床</span>
          <span style="font-weight:700" id="goal-wake-display">未設定</span>
        </div>
      </div>
      <div class="report-btn-wrap">
        <button class="report-btn night-mode" id="report-btn" onclick="handleReport()">
          <span class="btn-icon" id="btn-icon">🌙</span>
          <span class="btn-label" id="btn-label">シュウシン</span>
          <span class="btn-sublabel" id="btn-sublabel">タップして就寝報告</span>
        </button>
      </div>
      <div class="report-result" id="report-result"></div>
    </div>

    <!-- TIMELINE TAB -->
    <div class="tab-content" id="tab-timeline">
      <div class="timeline-header">
        <div>
          <div class="timeline-title">チームの現在ステータス</div>
          <div class="timeline-subtitle">各ユーザーの最新報告（シュウシン / キショウ）を表示</div>
        </div>
        <div class="live-badge"><div class="live-dot"></div>LIVE</div>
      </div>
      <div id="timeline-list">
        <div class="loading">読み込み中…</div>
      </div>
    </div>

    <!-- SETTINGS TAB -->
    <div class="tab-content" id="tab-settings">
      <div class="settings-card">
        <div class="settings-title">プロフィール設定</div>
        <div class="display-name-row">
          <label class="form-label">表示名</label>
          <input class="form-input time-input" type="text" id="display-name-input" placeholder="名前を入力" style="width:100%">
        </div>
      </div>
      <div class="settings-card">
        <div class="settings-title">目標時間</div>
        <div class="time-row">
          <span class="time-icon">🌙</span>
          <span class="time-label">目標就寝時刻</span>
          <input class="time-input" type="time" id="goal-sleep-input" value="23:00">
        </div>
        <div class="time-row">
          <span class="time-icon">☀️</span>
          <span class="time-label">目標起床時刻</span>
          <input class="time-input" type="time" id="goal-wake-input" value="06:00">
        </div>
        <button class="btn-save" onclick="saveSettings()">保存する</button>
        <span class="save-msg" id="save-msg">✓ 保存しました！</span>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script>
// #region agent log
const __debugRunId = 'initial';
function __debugLog(hypothesisId, location, message, data) {
  fetch('http://127.0.0.1:7933/ingest/f2667fe8-cf21-41c0-9743-99470d37919b',{method:'POST',headers:{'Content-Type':'application/json','X-Debug-Session-Id':'b3c2df'},body:JSON.stringify({sessionId:'b3c2df',runId:__debugRunId,hypothesisId,location,message,data,timestamp:Date.now()})}).catch(()=>{});
}
window.addEventListener('error', (e) => {
  __debugLog('H1', 'index.html:script-global-error', 'window error', { message: e.message, filename: e.filename, lineno: e.lineno, colno: e.colno });
});
window.addEventListener('unhandledrejection', (e) => {
  __debugLog('H1', 'index.html:script-unhandledrejection', 'window unhandled rejection', { reason: String(e.reason) });
});
__debugLog('H2', 'index.html:script-start', 'script started', { firebaseDefined: typeof firebase !== 'undefined' });
// #endregion
// ============================================================
//  FIREBASE CONFIG
//  ここに自分のFirebaseプロジェクトの設定を貼り付けてください
// ============================================================
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT_ID.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};

// #region agent log
__debugLog('H2', 'index.html:before-firebase-init', 'before firebase.initializeApp', {
  apiKeyIsPlaceholder: firebaseConfig.apiKey === 'YOUR_API_KEY',
  projectId: firebaseConfig.projectId
});
// #endregion
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// ============================================================
//  STATE
// ============================================================
let currentUser = null;
let userProfile = null;
let unsubTimeline = null;

// ============================================================
//  AUTH
// ============================================================
function switchAuthTab(tab) {
  const loginForm = document.getElementById('login-form');
  const registerForm = document.getElementById('register-form');
  const tabLogin = document.getElementById('tab-login');
  const tabRegister = document.getElementById('tab-register');
  const authError = document.getElementById('auth-error');
  // #region agent log
  __debugLog('H3', 'index.html:switchAuthTab-entry', 'switchAuthTab called', {
    tab,
    hasLoginForm: !!loginForm,
    hasRegisterForm: !!registerForm,
    hasTabLogin: !!tabLogin,
    hasTabRegister: !!tabRegister,
    hasAuthError: !!authError
  });
  // #endregion
  loginForm.style.display = tab === 'login' ? 'block' : 'none';
  registerForm.style.display = tab === 'register' ? 'block' : 'none';
  tabLogin.classList.toggle('active', tab === 'login');
  tabRegister.classList.toggle('active', tab === 'register');
  authError.style.display = 'none';
  // #region agent log
  __debugLog('H4', 'index.html:switchAuthTab-after-dom-update', 'switchAuthTab applied styles', {
    loginDisplay: loginForm.style.display,
    registerDisplay: registerForm.style.display,
    loginActive: tabLogin.classList.contains('active'),
    registerActive: tabRegister.classList.contains('active')
  });
  // #endregion
}

async function handleLogin() {
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  try {
    await auth.signInWithEmailAndPassword(email, password);
  } catch (e) {
    showAuthError(getFirebaseErrorMsg(e.code));
  }
}

async function handleRegister() {
  const name = document.getElementById('reg-name').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  const password = document.getElementById('reg-password').value;
  if (!name) return showAuthError('表示名を入力してください');
  if (name.length > 20) return showAuthError('表示名は20文字以内にしてください');
  try {
    const cred = await auth.createUserWithEmailAndPassword(email, password);
    await db.collection('users').doc(cred.user.uid).set({
      displayName: name,
      goalSleep: '23:00',
      goalWake: '06:00',
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
  } catch (e) {
    showAuthError(getFirebaseErrorMsg(e.code));
  }
}

function handleLogout() {
  if (unsubTimeline) unsubTimeline();
  auth.signOut();
}

function showAuthError(msg) {
  const el = document.getElementById('auth-error');
  el.textContent = msg;
  el.style.display = 'block';
}

function getFirebaseErrorMsg(code) {
  const map = {
    'auth/user-not-found': 'メールアドレスが見つかりません',
    'auth/wrong-password': 'パスワードが間違っています',
    'auth/email-already-in-use': 'このメールアドレスは既に登録されています',
    'auth/weak-password': 'パスワードは6文字以上必要です',
    'auth/invalid-email': 'メールアドレスの形式が正しくありません',
    'auth/invalid-credential': 'メールアドレスまたはパスワードが間違っています',
  };
  return map[code] || 'エラーが発生しました：' + code;
}

// ============================================================
//  AUTH STATE OBSERVER
// ============================================================
auth.onAuthStateChanged(async (user) => {
  if (user) {
    currentUser = user;
    await loadUserProfile();
    showMainScreen();
  } else {
    currentUser = null;
    userProfile = null;
    showAuthScreen();
  }
});

async function loadUserProfile() {
  const doc = await db.collection('users').doc(currentUser.uid).get();
  if (doc.exists) {
    userProfile = doc.data();
  } else {
    userProfile = { displayName: 'ユーザー', goalSleep: '23:00', goalWake: '06:00' };
  }
}

// ============================================================
//  SCREEN MANAGEMENT
// ============================================================
function showAuthScreen() {
  document.getElementById('auth-screen').style.display = 'flex';
  document.getElementById('main-screen').style.display = 'none';
  if (unsubTimeline) { unsubTimeline(); unsubTimeline = null; }
}

function showMainScreen() {
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('main-screen').style.display = 'block';

  const name = userProfile.displayName || 'ユーザー';
  document.getElementById('user-name-display').textContent = name;
  document.getElementById('user-avatar').textContent = name.charAt(0);

  document.getElementById('goal-sleep-input').value = userProfile.goalSleep || '23:00';
  document.getElementById('goal-wake-input').value = userProfile.goalWake || '06:00';
  document.getElementById('display-name-input').value = name;

  updateGoalDisplay();
  startClock();
  updateReportButton();
  subscribeTimeline();
}

// ============================================================
//  CLOCK
// ============================================================
function startClock() {
  updateClock();
  setInterval(() => { updateClock(); updateReportButton(); }, 1000);
}

function updateClock() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2, '0');
  const m = String(now.getMinutes()).padStart(2, '0');
  document.getElementById('clock').textContent = h + ':' + m;
  const days = ['日', '月', '火', '水', '木', '金', '土'];
  document.getElementById('date-display').textContent =
    now.getFullYear() + '年' + (now.getMonth()+1) + '月' + now.getDate() + '日（' + days[now.getDay()] + '）';
}

// ============================================================
//  REPORT BUTTON — auto night/day detection
// ============================================================
function isNightTime() {
  const h = new Date().getHours();
  // 18:00〜翌8:59 → 就寝モード
  return h >= 18 || h < 9;
}

function updateReportButton() {
  const btn = document.getElementById('report-btn');
  const icon = document.getElementById('btn-icon');
  const label = document.getElementById('btn-label');
  const sub = document.getElementById('btn-sublabel');
  if (isNightTime()) {
    btn.className = 'report-btn night-mode';
    icon.textContent = '🌙';
    label.textContent = 'シュウシン';
    sub.textContent = 'タップして就寝報告';
  } else {
    btn.className = 'report-btn day-mode';
    icon.textContent = '☀️';
    label.textContent = 'キショウ';
    sub.textContent = 'タップして起床報告';
  }
}

// ============================================================
//  HANDLE REPORT
// ============================================================
async function handleReport() {
  if (!currentUser || !userProfile) return;
  const now = new Date();
  const type = isNightTime() ? 'sleep' : 'wake';
  const goalTime = type === 'sleep' ? userProfile.goalSleep : userProfile.goalWake;
  const isOnTime = goalTime ? checkOnTime(now, goalTime, type) : null;

  const logData = {
    uid: currentUser.uid,
    displayName: userProfile.displayName || 'ユーザー',
    type,
    timestamp: firebase.firestore.FieldValue.serverTimestamp(),
    isOnTime,
    goalTime: goalTime || null,
    localTime: now.getHours() + ':' + String(now.getMinutes()).padStart(2, '0')
  };

  try {
    await db.collection('logs').add(logData);
    showReportResult(type, isOnTime);
    showToast('報告を送信しました！');
  } catch (e) {
    showToast('エラー：' + e.message);
  }
}

function checkOnTime(now, goalStr, type) {
  const [gh, gm] = goalStr.split(':').map(Number);
  const goalMinutes = gh * 60 + gm;
  const nowMinutes = now.getHours() * 60 + now.getMinutes();

  if (type === 'sleep') {
    // 就寝：今が目標より前（early）なら達成
    // 夜をまたぐ処理：例えば、目標23:00、現在22:30は達成
    // ただし深夜0時を超えた場合（例：0:30）は遅刻
    const adjNow = now.getHours() < 12 ? nowMinutes + 1440 : nowMinutes;
    const adjGoal = gh < 12 ? goalMinutes + 1440 : goalMinutes;
    return adjNow <= adjGoal;
  } else {
    // 起床：今が目標より前（early）なら達成
    return nowMinutes <= goalMinutes;
  }
}

function showReportResult(type, isOnTime) {
  const el = document.getElementById('report-result');
  if (isOnTime === null) {
    el.style.display = 'none';
    return;
  }
  if (isOnTime) {
    el.className = 'report-result success';
    el.textContent = '🔴 目標達成！全力' + (type === 'sleep' ? '睡眠' : '起床') + '！';
  } else {
    el.className = 'report-result late';
    el.textContent = '🔵 次は全力！ファイト！';
  }
  el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 5000);
}

// ============================================================
//  TIMELINE — realtime listener
// ============================================================
function subscribeTimeline() {
  if (unsubTimeline) unsubTimeline();
  const list = document.getElementById('timeline-list');
  list.innerHTML = '<div class="loading">読み込み中…</div>';

  let usersById = {};
  let latestLogByUid = {};

  function renderStatusBoard() {
    const userIds = Object.keys(usersById);
    if (userIds.length === 0) {
      list.innerHTML = '<div class="empty-timeline"><div class="big">🧑‍🤝‍🧑</div>ユーザーがまだいません</div>';
      return;
    }

    list.innerHTML = '';
    const grid = document.createElement('div');
    grid.className = 'status-grid';

    userIds.forEach((uid) => {
      const profile = usersById[uid] || {};
      const latest = latestLogByUid[uid] || null;
      grid.appendChild(renderStatusCard(profile, latest));
    });

    list.appendChild(grid);
  }

  const usersUnsub = db.collection('users')
    .onSnapshot((snapshot) => {
      const nextUsersById = {};
      snapshot.forEach((doc) => {
        nextUsersById[doc.id] = { uid: doc.id, ...doc.data() };
      });
      usersById = nextUsersById;
      renderStatusBoard();
    }, () => {
      list.innerHTML = '<div class="empty-timeline">ユーザー情報の取得に失敗しました</div>';
    });

  const logsUnsub = db.collection('logs')
    .orderBy('timestamp', 'desc')
    .limit(200)
    .onSnapshot((snapshot) => {
      const nextLatestLogByUid = {};
      snapshot.forEach((doc) => {
        const d = doc.data();
        if (!d.uid || nextLatestLogByUid[d.uid]) return;
        nextLatestLogByUid[d.uid] = d;
      });
      latestLogByUid = nextLatestLogByUid;
      renderStatusBoard();
    }, () => {
      list.innerHTML = '<div class="empty-timeline">ステータス情報の取得に失敗しました</div>';
    });

  unsubTimeline = () => {
    usersUnsub();
    logsUnsub();
  };
}

function renderStatusCard(profile, latestLog) {
  const div = document.createElement('div');
  const statusType = latestLog && latestLog.type === 'sleep' ? 'sleeping' : latestLog && latestLog.type === 'wake' ? 'awake' : 'unknown';
  div.className = 'status-card ' + statusType;

  const statusMap = {
    sleeping: { label: '睡眠中', chipIcon: '🌙', eventLabel: 'シュウシン' },
    awake: { label: '活動中', chipIcon: '☀️', eventLabel: 'キショウ' },
    unknown: { label: '未報告', chipIcon: '•', eventLabel: '最新報告' }
  };
  const statusInfo = statusMap[statusType];
  const displayName = profile.displayName || latestLog?.displayName || 'ユーザー';
  const latestTime = getLatestLogTime(latestLog);

  div.innerHTML = `
    <div class="status-card-header">
      <div class="status-user">${escapeHtml(displayName)}</div>
      <span class="status-chip ${statusType}">${statusInfo.chipIcon} ${statusInfo.label}</span>
    </div>
    <div class="status-meta">
      <span class="status-event">${statusInfo.eventLabel}</span>
      <span class="status-time">${latestTime}</span>
    </div>
  `;
  return div;
}

function getLatestLogTime(latestLog) {
  if (!latestLog) return '--:--';
  if (latestLog.localTime) return latestLog.localTime;
  if (latestLog.timestamp && latestLog.timestamp.toDate) {
    const t = latestLog.timestamp.toDate();
    return String(t.getHours()).padStart(2, '0') + ':' + String(t.getMinutes()).padStart(2, '0');
  }
  return '--:--';
}

function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ============================================================
//  SETTINGS
// ============================================================
function updateGoalDisplay() {
  document.getElementById('goal-sleep-display').textContent = userProfile.goalSleep || '未設定';
  document.getElementById('goal-wake-display').textContent = userProfile.goalWake || '未設定';
}

async function saveSettings() {
  if (!currentUser) return;
  const name = document.getElementById('display-name-input').value.trim();
  const goalSleep = document.getElementById('goal-sleep-input').value;
  const goalWake = document.getElementById('goal-wake-input').value;
  if (!name) return showToast('表示名を入力してください');

  await db.collection('users').doc(currentUser.uid).set({
    displayName: name,
    goalSleep,
    goalWake
  }, { merge: true });

  userProfile = { ...userProfile, displayName: name, goalSleep, goalWake };
  document.getElementById('user-name-display').textContent = name;
  document.getElementById('user-avatar').textContent = name.charAt(0);
  updateGoalDisplay();

  const msg = document.getElementById('save-msg');
  msg.style.display = 'inline';
  setTimeout(() => { msg.style.display = 'none'; }, 2500);
}

// ============================================================
//  TAB NAVIGATION
// ============================================================
function switchTab(name) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  event.target.classList.add('active');
}

// ============================================================
//  TOAST
// ============================================================
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}
</script>
