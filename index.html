<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全力睡眠 — チーム睡眠管理</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #0a0e1a;
    --night-2: #111827;
    --night-3: #1c2535;
    --night-4: #253047;
    --moon: #c8d8f8;
    --moon-2: #8fa8e8;
    --sun: #f5c842;
    --sun-2: #ff9a3c;
    --red: #ff4d6d;
    --blue: #4facfe;
    --green: #43e97b;
    --text: #e8edf8;
    --text-2: #8fa8c8;
    --border: rgba(200,216,248,0.1);
    --radius: 16px;
    --radius-sm: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: var(--night);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Stars background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 20% 15%, rgba(255,255,255,0.6) 0%, transparent 100%),
      radial-gradient(1px 1px at 80% 25%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 50% 50%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 30% 75%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 70% 85%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 10% 60%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 90% 70%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 45% 30%, rgba(255,255,255,0.6) 0%, transparent 100%);
    pointer-events: none;
    z-index: 0;
  }

  #app { position: relative; z-index: 1; }

  /* ===== AUTH SCREEN ===== */
  #auth-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 2rem 1.5rem;
  }
  .auth-logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 3.5rem;
    letter-spacing: 0.05em;
    background: linear-gradient(135deg, var(--moon), var(--sun));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 0.25rem;
  }
  .auth-tagline {
    font-size: 0.85rem;
    color: var(--text-2);
    margin-bottom: 2.5rem;
    letter-spacing: 0.05em;
  }
  .auth-card {
    background: var(--night-2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 2rem;
    width: 100%;
    max-width: 400px;
  }
  .auth-tabs {
    display: flex;
    gap: 0;
    background: var(--night-3);
    border-radius: var(--radius-sm);
    padding: 4px;
    margin-bottom: 1.5rem;
  }
  .auth-tab {
    flex: 1;
    padding: 0.5rem;
    border: none;
    background: transparent;
    color: var(--text-2);
    font-family: inherit;
    font-size: 0.9rem;
    border-radius: 7px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .auth-tab.active {
    background: var(--night-4);
    color: var(--moon);
    font-weight: 700;
  }
  .form-group { margin-bottom: 1rem; }
  .form-label {
    display: block;
    font-size: 0.8rem;
    color: var(--text-2);
    margin-bottom: 0.4rem;
    letter-spacing: 0.05em;
  }
  .form-input {
    width: 100%;
    padding: 0.75rem 1rem;
    background: var(--night-3);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: inherit;
    font-size: 1rem;
    outline: none;
    transition: border-color 0.2s;
  }
  .form-input:focus { border-color: var(--moon-2); }
  .btn-primary {
    width: 100%;
    padding: 0.85rem;
    background: linear-gradient(135deg, #3a7bd5, #5a6fd6);
    border: none;
    border-radius: var(--radius-sm);
    color: white;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
    margin-top: 0.5rem;
  }
  .btn-primary:hover { opacity: 0.9; }
  .btn-primary:active { transform: scale(0.98); }
  .auth-error {
    color: var(--red);
    font-size: 0.85rem;
    margin-top: 0.75rem;
    text-align: center;
    display: none;
  }

  /* ===== MAIN APP ===== */
  #main-screen { display: none; }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1.25rem 1.5rem;
    border-bottom: 1px solid var(--border);
    background: rgba(10,14,26,0.8);
    backdrop-filter: blur(10px);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.6rem;
    letter-spacing: 0.05em;
    background: linear-gradient(135deg, var(--moon), var(--sun));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .header-user {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }
  .user-avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--night-3), var(--night-4));
    border: 1px solid var(--moon-2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--moon);
  }
  .btn-logout {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-2);
    font-family: inherit;
    font-size: 0.8rem;
    padding: 0.4rem 0.75rem;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-logout:hover { border-color: var(--text-2); color: var(--text); }

  .tabs-nav {
    display: flex;
    border-bottom: 1px solid var(--border);
    background: var(--night);
    position: sticky;
    top: 65px;
    z-index: 99;
  }
  .tab-btn {
    flex: 1;
    padding: 0.85rem;
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--text-2);
    font-family: inherit;
    font-size: 0.85rem;
    cursor: pointer;
    transition: all 0.2s;
  }
  .tab-btn.active {
    color: var(--moon);
    border-bottom-color: var(--moon);
  }

  .tab-content { display: none; padding: 1.5rem; }
  .tab-content.active { display: block; }

  /* ===== REPORT TAB ===== */
  .time-display {
    text-align: center;
    margin-bottom: 2rem;
  }
  .current-time {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 4rem;
    letter-spacing: 0.05em;
    color: var(--moon);
    line-height: 1;
  }
  .current-date {
    font-size: 0.85rem;
    color: var(--text-2);
    margin-top: 0.25rem;
  }

  /* The big button */
  .report-btn-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin: 1.5rem 0 2rem;
  }
  .report-btn {
    width: 200px;
    height: 200px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    transition: transform 0.15s, box-shadow 0.3s;
    position: relative;
    overflow: hidden;
  }
  .report-btn:active { transform: scale(0.94); }
  .report-btn.night-mode {
    background: radial-gradient(circle at 40% 40%, #1e3a6e, #0a1628);
    box-shadow: 0 0 40px rgba(100,160,255,0.3), 0 0 80px rgba(100,160,255,0.1), inset 0 0 30px rgba(255,255,255,0.05);
  }
  .report-btn.day-mode {
    background: radial-gradient(circle at 40% 40%, #f5a623, #e05b00);
    box-shadow: 0 0 40px rgba(245,168,35,0.4), 0 0 80px rgba
