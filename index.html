<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全力睡眠 — チーム睡眠管理</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #0a0e1a;
    --night-2: #111827;
    --night-3: #1c2535;
    --night-4: #253047;
    --moon: #c8d8f8;
    --moon-2: #8fa8e8;
    --sun: #f5c842;
    --sun-2: #ff9a3c;
    --red: #ff4d6d;
    --blue: #4facfe;
    --green: #43e97b;
    --text: #e8edf8;
    --text-2: #8fa8c8;
    --border: rgba(200,216,248,0.1);
    --radius: 16px;
    --radius-sm: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: var(--night);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 20% 15%, rgba(255,255,255,0.6) 0%, transparent 100%),
      radial-gradient(1px 1px at 80% 25%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 50% 50%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 30% 75%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 70% 85%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 10% 60%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 90% 70%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 45% 30%, rgba(255,255,255,0.6) 0%, transparent 100%);
    pointer-events: none;
    z-index: 0;
  }

  #app { position: relative; z-index: 1; }

  /* ===== AUTH SCREEN ===== */
  #auth-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 2rem 1.5rem;
  }
  .auth-logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 3.5rem;
    letter-spacing: 0.05em;
    background: linear-gradient(135deg, var(--moon), var(--sun));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 0.25rem;
  }
  .auth-tagline {
    font-size: 0.85rem;
    color: var(--text-2);
    margin-bottom: 2.5rem;
    letter-spacing: 0.05em;
  }
  .auth-card {
    background: var(--night-2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 2rem;
    width: 100%;
    max-width: 400px;
  }
  .auth-tabs {
    display: flex;
    gap: 0;
    background: var(--night-3);
    border-radius: var(--radius-sm);
    padding: 4px;
    margin-bottom: 1.5rem;
  }
  .auth-tab {
    flex: 1;
    padding: 0.5rem;
    border: none;
    background: transparent;
    color: var(--text-2);
    font-family: inherit;
    font-size: 0.9rem;
    border-radius: 7px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .auth-tab.active {
    background: var(--night-4);
    color: var(--moon);
    font-weight: 700;
  }
  .form-group { margin-bottom: 1rem; }
  .form-label {
    display: block;
    font-size: 0.8rem;
    color: var(--text-2);
    margin-bottom: 0.4rem;
    letter-spacing: 0.05em;
  }
  .form-input {
    width: 100%;
    padding: 0.75rem 1rem;
    background: var(--night-3);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: inherit;
    font-size: 1rem;
    outline: none;
    transition: border-color 0.2s;
  }
  .form-input:focus { border-color: var(--moon-2); }
  .btn-primary {
    width: 100%;
    padding: 0.85rem;
    background: linear-gradient(135deg, #3a7bd5, #5a6fd6);
    border: none;
    border-radius: var(--radius-sm);
    color: white;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
    margin-top: 0.5rem;
  }
  .btn-primary:hover { opacity: 0.9; }
  .btn-primary:active { transform: scale(0.98); }
  .auth-error {
    color: var(--red);
    font-size: 0.85rem;
    margin-top: 0.75rem;
    text-align: center;
    display: none;
  }

  /* ===== MAIN APP ===== */
  #main-screen { display: none; }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1.25rem 1.5rem;
    border-bottom: 1px solid var(--border);
    background: rgba(10,14,26,0.8);
    backdrop-filter: blur(10px);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.6rem;
    letter-spacing: 0.05em;
    background: linear-gradient(135deg, var(--moon), var(--sun));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .header-user {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }
  .user-avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--night-3), var(--night-4));
    border: 1px solid var(--moon-2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--moon);
  }
  .btn-logout {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-2);
    font-family: inherit;
    font-size: 0.8rem;
    padding: 0.4rem 0.75rem;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-logout:hover { border-color: var(--text-2); color: var(--text); }

  .tabs-nav {
    display: flex;
    border-bottom: 1px solid var(--border);
    background: var(--night);
    position: sticky;
    top: 65px;
    z-index: 99;
  }
  .tab-btn {
    flex: 1;
    padding: 0.85rem;
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--text-2);
    font-family: inherit;
    font-size: 0.85rem;
    cursor: pointer;
    transition: all 0.2s;
  }
  .tab-btn.active {
    color: var(--moon);
    border-bottom-color: var(--moon);
  }

  .tab-content { display: none; padding: 1.5rem; }
  .tab-content.active { display: block; }

  /* ===== REPORT TAB ===== */
  .time-display {
    text-align: center;
    margin-bottom: 2rem;
  }
  .current-time {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 4rem;
    letter-spacing: 0.05em;
    color: var(--moon);
    line-height: 1;
  }
  .current-date {
    font-size: 0.85rem;
    color: var(--text-2);
    margin-top: 0.25rem;
  }

  .report-btn-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin: 1.5rem 0 2rem;
  }
  .report-btn {
    width: 200px;
    height: 200px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    transition: transform 0.15s, box-shadow 0.3s;
    position: relative;
    overflow: hidden;
  }
  .report-btn:active { transform: scale(0.94); }
  .report-btn.night-mode {
    background: radial-gradient(circle at 40% 40%, #1e3a6e, #0a1628);
    box-shadow: 0 0 40px rgba(100,160,255,0.3), 0 0 80px rgba(100,160,255,0.1), inset 0 0 30px rgba(255,255,255,0.05);
  }
  .report-btn.day-mode {
    background: radial-gradient(circle at 40% 40%, #f5a623, #e05b00);
    box-shadow: 0 0 40px rgba(245,168,35,0.4), 0 0 80px rgba(245,168,35,0.2), inset 0 0 30px rgba(255,255,255,0.1);
  }
  .report-btn:hover.night-mode { box-shadow: 0 0 60px rgba(100,160,255,0.5), 0 0 100px rgba(100,160,255,0.2); }
  .report-btn:hover.day-mode { box-shadow: 0 0 60px rgba(245,168,35,0.6), 0 0 100px rgba(245,168,35,0.3); }
  .btn-icon { font-size: 3.5rem; line-height: 1; }
  .btn-label {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.4rem;
    letter-spacing: 0.1em;
    color: white;
  }
  .btn-sublabel { font-size: 0.75rem; color: rgba(255,255,255,0.7); }

  .report-result {
    text-align: center;
    padding: 1rem 1.5rem;
    border-radius: var(--radius);
    font-size: 1.1rem;
    font-weight: 700;
    display: none;
    animation: fadeIn 0.4s ease;
  }
  .report-result.success {
    background: rgba(67,233,123,0.1);
    border: 1px solid rgba(67,233,123,0.3);
    color: var(--green);
  }
  .report-result.late {
    background: rgba(79,172,254,0.1);
    border: 1px solid rgba(79,172,254,0.3);
    color: var(--blue);
  }

  /* ===== GOAL SETTINGS ===== */
  .settings-card {
    background: var(--night-2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.5rem;
    margin-bottom: 1rem;
  }
  .settings-title {
    font-size: 0.8rem;
    color: var(--text-2);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 1rem;
  }
  .time-row {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-bottom: 1rem;
  }
  .time-icon { font-size: 1.5rem; }
  .time-label { flex: 1; font-size: 0.95rem; }
  .time-input {
    padding: 0.5rem 0.75rem;
    background: var(--night-3);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: inherit;
    font-size: 1rem;
    outline: none;
    width: 120px;
  }
  .time-input:focus { border-color: var(--moon-2); }
  .display-name-row { margin-bottom: 1rem; }
  .btn-save {
    padding: 0.75rem 1.5rem;
    background: linear-gradient(135deg, #0f4c81, #1a6bb5);
    border: none;
    border-radius: var(--radius-sm);
    color: white;
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .btn-save:hover { opacity: 0.85; }
  .save-msg {
    font-size: 0.85rem;
    color: var(--green);
    margin-left: 1rem;
    display: none;
  }

  /* ===== TIMELINE TAB ===== */
  .timeline-section-label {
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-2);
    margin-bottom: 0.85rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .timeline-section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* ===== USER STATUS GRID ===== */
  .status-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 0.85rem;
    margin-bottom: 2rem;
  }
  @media (min-width: 480px) {
    .status-grid { grid-template-columns: repeat(3, 1fr); }
  }

  .status-card {
    border-radius: var(--radius);
    padding: 1rem 0.9rem 0.9rem;
    border: 1px solid transparent;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
    transition: transform 0.2s, box-shadow 0.2s;
    animation: fadeIn 0.4s ease;
  }
  .status-card:hover { transform: translateY(-2px); }

  .status-card.sleeping {
    background: linear-gradient(145deg, #0d1a35 0%, #111f3d 100%);
    border-color: rgba(79, 130, 255, 0.25);
    box-shadow: 0 0 18px rgba(79,130,255,0.1), inset 0 0 20px rgba(79,130,255,0.04);
  }
  .status-card.awake {
    background: linear-gradient(145deg, #1f1200 0%, #2a1800 100%);
    border-color: rgba(245,168,35,0.25);
    box-shadow: 0 0 18px rgba(245,168,35,0.1), inset 0 0 20px rgba(245,168,35,0.04);
  }

  .card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .card-status-badge {
    display: flex;
    align-items: center;
    gap: 0.35rem;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    padding: 0.2rem 0.55rem;
    border-radius: 20px;
  }
  .card-status-badge.sleeping {
    background: rgba(79,130,255,0.15);
    color: #7ab0ff;
    border: 1px solid rgba(79,130,255,0.3);
  }
  .card-status-badge.awake {
    background: rgba(245,168,35,0.15);
    color: #f5c842;
    border: 1px solid rgba(245,168,35,0.3);
  }
  .status-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .status-dot.sleeping { background: #7ab0ff; animation: pulse 2s infinite; }
  .status-dot.awake    { background: #f5c842; animation: pulse 2s infinite; }

  .card-avatar-row {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin-top: 0.2rem;
  }
  .card-avatar {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.85rem;
    font-weight: 900;
    flex-shrink: 0;
  }
  .card-avatar.sleeping {
    background: linear-gradient(135deg, #1e3a6e, #0a1f4e);
    border: 1.5px solid rgba(79,130,255,0.4);
    color: #a0c0ff;
  }
  .card-avatar.awake {
    background: linear-gradient(135deg, #5c3300, #3a2000);
    border: 1.5px solid rgba(245,168,35,0.4);
    color: #f5c842;
  }
  .card-name {
    font-size: 0.95rem;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* カード：日時表示（NEW） */
  .card-datetime-block {
    margin-top: 0.25rem;
    display: flex;
    flex-direction: column;
    gap: 0.1rem;
  }
  .card-date-label {
    font-size: 0.68rem;
    color: var(--text-2);
    letter-spacing: 0.04em;
  }
  .card-datetime-row {
    display: flex;
    align-items: baseline;
    gap: 0.4rem;
  }
  .card-time-icon { font-size: 0.85rem; }
  .card-time-label { font-size: 0.72rem; color: var(--text-2); }
  .card-time-value {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.35rem;
    letter-spacing: 0.05em;
    line-height: 1;
  }
  .card-time-value.sleeping { color: #90b8ff; }
  .card-time-value.awake    { color: #f5c842; }

  /* カード：達成バッジ */
  .card-achieve-badge {
    display: inline-block;
    font-size: 0.72rem;
    font-weight: 700;
    padding: 0.28rem 0.6rem;
    border-radius: 20px;
    margin-top: 0.25rem;
    letter-spacing: 0.03em;
  }
  .card-achieve-badge.achieved {
    background: rgba(67,233,123,0.15);
    color: #43e97b;
    border: 1px solid rgba(67,233,123,0.35);
  }
  .card-achieve-badge.missed {
    background: rgba(79,172,254,0.15);
    color: #4facfe;
    border: 1px solid rgba(79,172,254,0.35);
  }

  /* ===== 目標一覧テーブル (NEW) ===== */
  .goals-table-wrap {
    margin-top: 0.5rem;
  }
  .goals-table {
    width: 100%;
    border-collapse: collapse;
  }
  .goals-table thead tr th {
    font-size: 0.72rem;
    color: var(--text-2);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 0.4rem 0.75rem;
    text-align: left;
    border-bottom: 1px solid var(--border);
    font-weight: 500;
  }
  .goals-table tbody tr {
    border-bottom: 1px solid rgba(200,216,248,0.05);
    transition: background 0.15s;
  }
  .goals-table tbody tr:last-child { border-bottom: none; }
  .goals-table tbody tr:hover { background: rgba(255,255,255,0.03); }
  .goals-table td {
    padding: 0.65rem 0.75rem;
    font-size: 0.88rem;
    vertical-align: middle;
  }
  .gt-name {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .gt-avatar {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--night-3), var(--night-4));
    border: 1px solid var(--moon-2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.7rem;
    font-weight: 700;
    color: var(--moon);
    flex-shrink: 0;
  }
  .gt-time {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.1rem;
    letter-spacing: 0.05em;
  }
  .gt-time.sleep { color: #90b8ff; }
  .gt-time.wake  { color: #f5c842; }
  .gt-unset {
    color: var(--text-2);
    font-size: 0.8rem;
  }
  .goals-empty {
    text-align: center;
    color: var(--text-2);
    font-size: 0.85rem;
    padding: 1.5rem 0 0.5rem;
  }

  /* ===== HISTORY LOG ===== */
  .timeline-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1rem;
  }
  .live-badge {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.75rem;
    color: var(--green);
    background: rgba(67,233,123,0.1);
    padding: 0.3rem 0.65rem;
    border-radius: 20px;
    border: 1px solid rgba(67,233,123,0.2);
  }
  .live-dot {
    width: 6px;
    height: 6px;
    background: var(--green);
    border-radius: 50%;
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  .empty-timeline {
    text-align: center;
    padding: 3rem 1rem;
    color: var(--text-2);
    font-size: 0.9rem;
  }
  .empty-timeline .big { font-size: 2.5rem; margin-bottom: 0.5rem; }

  .loading {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3rem;
    color: var(--text-2);
    font-size: 0.9rem;
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--night-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 0.75rem 1.25rem;
    font-size: 0.9rem;
    color: var(--text);
    opacity: 0;
    transition: all 0.3s;
    z-index: 999;
    white-space: nowrap;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  @media (max-width: 480px) {
    .report-btn { width: 170px; height: 170px; }
    .current-time { font-size: 3rem; }
  }
</style>
</head>
<body>

<div id="app">
  <div id="auth-screen">
    <div class="auth-logo">全力睡眠</div>
    <div class="auth-tagline">チームで作る最強の睡眠習慣</div>
    <div class="auth-card">
      <div class="auth-tabs">
        <button class="auth-tab active" id="tab-login" onclick="switchAuthTab('login')">ログイン</button>
        <button class="auth-tab" id="tab-register" onclick="switchAuthTab('register')">新規登録</button>
      </div>
      <div id="login-form">
        <div class="form-group">
          <label class="form-label">メールアドレス</label>
          <input class="form-input" type="email" id="login-email" placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label class="form-label">パスワード</label>
          <input class="form-input" type="password" id="login-password" placeholder="••••••••">
        </div>
        <button class="btn-primary" onclick="handleLogin()">ログイン →</button>
      </div>
      <div id="register-form" style="display:none">
        <div class="form-group">
          <label class="form-label">表示名（部活での名前）</label>
          <input class="form-input" type="text" id="reg-name" placeholder="例：田中">
        </div>
        <div class="form-group">
          <label class="form-label">メールアドレス</label>
          <input class="form-input" type="email" id="reg-email" placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label class="form-label">パスワード（6文字以上）</label>
          <input class="form-input" type="password" id="reg-password" placeholder="••••••••">
        </div>

<script>
  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = src;
      s.onload = resolve;
      s.onerror = reject;
      document.head.appendChild(s);
    });
  }

  const FB_VER = '10.12.0';
  const PKGS = ['firebase-app-compat', 'firebase-auth-compat', 'firebase-firestore-compat'];

  async function loadFirebase() {
    try {
      for (const pkg of PKGS) {
        await loadScript(`https://www.gstatic.com/firebasejs/${FB_VER}/${pkg}.js`);
      }
      return true;
    } catch (_) {}
    try {
      for (const pkg of PKGS) {
        await loadScript(`https://unpkg.com/${pkg}@${FB_VER}/dist/${pkg}.js`);
      }
      return true;
    } catch (_) {}
    try {
      for (const pkg of PKGS) {
        await loadScript(`https://cdn.jsdelivr.net/npm/${pkg}@${FB_VER}/dist/${pkg}.min.js`);
      }
      return true;
    } catch (_) {}
    return false;
  }

  window.__firebaseReady = loadFirebase();
</script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyA6pL850vO-zKRfy0LzTjK_I5aYEllbbMk",
  authDomain: "sleepy-nuts.firebaseapp.com",
  projectId: "sleepy-nuts",
  storageBucket: "sleepy-nuts.firebasestorage.app",
  messagingSenderId: "45736862470",
  appId: "1:45736862470:web:780336e12ecfcda222f487"
};

let auth, db;

window.__firebaseReady.then((loaded) => {
  if (!loaded || typeof firebase === 'undefined') {
    document.body.innerHTML = '<div style="color:#ff4d6d;padding:2rem;font-family:sans-serif;line-height:1.8">'
      + '⚠️ Firebase SDKの読み込みに失敗しました。<br>'
      + '以下をお試しください：<br>'
      + '① ページを再読み込み（Ctrl+R / Cmd+R）<br>'
      + '② ブラウザのキャッシュをクリア<br>'
      + '③ 広告ブロッカーを一時的にオフ</div>';
    return;
  }
  firebase.initializeApp(firebaseConfig);
  auth = firebase.auth();
  db   = firebase.firestore();
  auth.onAuthStateChanged(onAuthStateChanged_handler);
});

// ============================================================
//  STATE
// ============================================================
let currentUser = null;
let userProfile = null;
let unsubTimeline = null;
let unsubUsers = null;
let lastReportType = null;

const userStatusMap = new Map();

// ============================================================
//  AUTH
// ============================================================
function switchAuthTab(tab) {
  document.getElementById('login-form').style.display = tab === 'login' ? 'block' : 'none';
  document.getElementById('register-form').style.display = tab === 'register' ? 'block' : 'none';
  document.getElementById('tab-login').classList.toggle('active', tab === 'login');
  document.getElementById('tab-register').classList.toggle('active', tab === 'register');
  document.getElementById('auth-error').style.display = 'none';
}

async function handleLogin() {
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  try {
    await auth.signInWithEmailAndPassword(email, password);
  } catch (e) {
    showAuthError(getFirebaseErrorMsg(e.code));
  }
}

async function handleRegister() {
  const name = document.getElementById('reg-name').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  const password = document.getElementById('reg-password').value;
  if (!name) return showAuthError('表示名を入力してください');
  if (name.length > 20) return showAuthError('表示名は20文字以内にしてください');
  try {
    const cred = await auth.createUserWithEmailAndPassword(email, password);
    await db.collection('users').doc(cred.user.uid).set({
      displayName: name,
      goalSleep: '23:00',
      goalWake: '06:00',
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
  } catch (e) {
    showAuthError(getFirebaseErrorMsg(e.code));
  }
}

function handleLogout() {
  if (unsubTimeline) unsubTimeline();
  if (unsubUsers) unsubUsers();
  auth.signOut();
}

function showAuthError(msg) {
  const el = document.getElementById('auth-error');
  el.textContent = msg;
  el.style.display = 'block';
}

function getFirebaseErrorMsg(code) {
  const map = {
    'auth/user-not-found': 'メールアドレスが見つかりません',
    'auth/wrong-password': 'パスワードが間違っています',
    'auth/email-already-in-use': 'このメールアドレスは既に登録されています',
    'auth/weak-password': 'パスワードは6文字以上必要です',
    'auth/invalid-email': 'メールアドレスの形式が正しくありません',
    'auth/invalid-credential': 'メールアドレスまたはパスワードが間違っています',
  };
  return map[code] || 'エラーが発生しました：' + code;
}

// ============================================================
//  AUTH STATE OBSERVER
// ============================================================
async function onAuthStateChanged_handler(user) {
  if (user) {
    currentUser = user;
    await loadUserProfile();
    await fetchLastReportType();
    showMainScreen();
  } else {
    currentUser = null;
    userProfile = null;
    lastReportType = null;
    userStatusMap.clear();
    showAuthScreen();
  }
}

async function loadUserProfile() {
  const doc = await db.collection('users').doc(currentUser.uid).get();
  if (doc.exists) {
    userProfile = doc.data();
  } else {
    userProfile = { displayName: 'ユーザー', goalSleep: '23:00', goalWake: '06:00' };
  }
}

async function fetchLastReportType() {
  try {
    const snapshot = await db.collection('logs')
      .where('uid', '==', currentUser.uid)
      .orderBy('timestamp', 'desc')
      .limit(1)
      .get();

    if (!snapshot.empty) {
      lastReportType = snapshot.docs[0].data().type;
    } else {
      const h = new Date().getHours();
      lastReportType = (h >= 18 || h < 9) ? 'wake' : 'sleep';
    }
  } catch (e) {
    console.error(e);
    lastReportType = 'wake';
  }
}

// ============================================================
//  SCREEN MANAGEMENT
// ============================================================
function showAuthScreen() {
  document.getElementById('auth-screen').style.display = 'flex';
  document.getElementById('main-screen').style.display = 'none';
  if (unsubTimeline) { unsubTimeline(); unsubTimeline = null; }
  if (unsubUsers)    { unsubUsers();    unsubUsers = null; }
}

function showMainScreen() {
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('main-screen').style.display = 'block';

  const name = userProfile.displayName || 'ユーザー';
  document.getElementById('user-name-display').textContent = name;
  document.getElementById('user-avatar').textContent = name.charAt(0);

  document.getElementById('goal-sleep-input').value = userProfile.goalSleep || '23:00';
  document.getElementById('goal-wake-input').value = userProfile.goalWake || '06:00';
  document.getElementById('display-name-input').value = name;

  updateGoalDisplay();
  startClock();
  updateReportButton();
  subscribeTimeline();
  subscribeUsers();
}

// ============================================================
//  CLOCK
// ============================================================
function startClock() {
  updateClock();
  setInterval(updateClock, 1000);
}

function updateClock() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2, '0');
  const m = String(now.getMinutes()).padStart(2, '0');
  document.getElementById('clock').textContent = h + ':' + m;
  const days = ['日', '月', '火', '水', '木', '金', '土'];
  document.getElementById('date-display').textContent =
    now.getFullYear() + '年' + (now.getMonth()+1) + '月' + now.getDate() + '日（' + days[now.getDay()] + '）';
}

// ============================================================
//  REPORT BUTTON
// ============================================================
function updateReportButton() {
  const btn = document.getElementById('report-btn');
  const icon = document.getElementById('btn-icon');
  const label = document.getElementById('btn-label');
  const sub = document.getElementById('btn-sublabel');

  if (lastReportType === 'wake') {
    btn.className = 'report-btn night-mode';
    icon.textContent = '🌙';
    label.textContent = 'シュウシン';
    sub.textContent = 'タップして就寝報告';
  } else {
    btn.className = 'report-btn day-mode';
    icon.textContent = '☀️';
    label.textContent = 'キショウ';
    sub.textContent = 'タップして起床報告';
  }
}

// ============================================================
//  HANDLE REPORT
// ============================================================
async function handleReport() {
  if (!currentUser || !userProfile) return;
  const now = new Date();

  const type = (lastReportType === 'wake') ? 'sleep' : 'wake';
  const goalTime = type === 'sleep' ? userProfile.goalSleep : userProfile.goalWake;
  const isOnTime = goalTime ? checkOnTime(now, goalTime, type) : null;

  const localTime = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
  // ★ 月日を保存する（例："6/1"）
  const localDate = (now.getMonth() + 1) + '/' + now.getDate();

  const logData = {
    uid: currentUser.uid,
    displayName: userProfile.displayName || 'ユーザー',
    type,
    timestamp: firebase.firestore.FieldValue.serverTimestamp(),
    isOnTime,
    goalTime: goalTime || null,
    localTime,
    localDate   // ★ 追加
  };

  try {
    await db.collection('logs').add(logData);
    lastReportType = type;
    updateReportButton();
    showReportResult(type, isOnTime);
    showToast('報告を送信しました！');
  } catch (e) {
    showToast('エラー：' + e.message);
  }
}

function checkOnTime(now, goalStr, type) {
  const [gh, gm] = goalStr.split(':').map(Number);
  const goalMinutes = gh * 60 + gm;
  const nowMinutes = now.getHours() * 60 + now.getMinutes();

  if (type === 'sleep') {
    const adjNow = now.getHours() < 12 ? nowMinutes + 1440 : nowMinutes;
    const adjGoal = gh < 12 ? goalMinutes + 1440 : goalMinutes;
    return adjNow <= adjGoal;
  } else {
    return nowMinutes <= goalMinutes;
  }
}

function showReportResult(type, isOnTime) {
  const el = document.getElementById('report-result');
  if (isOnTime === null) { el.style.display = 'none'; return; }
  if (isOnTime) {
    el.className = 'report-result success';
    el.textContent = '🔴 目標達成！全力' + (type === 'sleep' ? '睡眠' : '起床') + '！';
  } else {
    el.className = 'report-result late';
    el.textContent = '🔵 次は全力！ファイト！';
  }
  el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 5000);
}

// ============================================================
//  TIMELINE + STATUS GRID（リアルタイム購読）
// ============================================================
function subscribeTimeline() {
  if (unsubTimeline) unsubTimeline();

  const grid = document.getElementById('status-grid');
  grid.innerHTML = '<div class="loading" style="grid-column:1/-1">読み込み中…</div>';

  unsubTimeline = db.collection('logs')
    .orderBy('timestamp', 'desc')
    .limit(50)
    .onSnapshot((snapshot) => {
      userStatusMap.clear();
      snapshot.forEach((doc) => {
        const d = doc.data();
        if (!d.uid) return;
        if (!userStatusMap.has(d.uid)) {
          userStatusMap.set(d.uid, {
            uid: d.uid,
            displayName: d.displayName || 'ユーザー',
            type: d.type,
            localTime: d.localTime || '',
            localDate: d.localDate || '',   // ★ 追加
            timestamp: d.timestamp,
            isOnTime: d.isOnTime ?? null,
            goalTime: d.goalTime || null
          });
        }
      });
      renderStatusGrid();
    }, (err) => {
      console.error(err);
      grid.innerHTML = '<div class="empty-timeline">データの取得に失敗しました</div>';
    });
}

// ── ステータスグリッド描画 ──
function renderStatusGrid() {
  const grid = document.getElementById('status-grid');
  grid.innerHTML = '';

  if (userStatusMap.size === 0) {
    grid.innerHTML = '<div class="empty-timeline" style="grid-column:1/-1"><div class="big">💤</div>まだ報告がありません</div>';
    return;
  }

  const entries = Array.from(userStatusMap.values());
  entries.sort((a, b) => {
    if (a.type === b.type) return 0;
    return a.type === 'sleep' ? -1 : 1;
  });

  entries.forEach((u) => {
    grid.appendChild(renderStatusCard(u));
  });
}

function renderStatusCard(u) {
  const isSleeping = u.type === 'sleep';
  const stateClass = isSleeping ? 'sleeping' : 'awake';
  const badgeLabel = isSleeping ? '睡眠中' : '起床中';
  const timeLabel  = isSleeping ? 'シュウシン' : 'キショウ';
  const timeIcon   = isSleeping ? '🌙' : '☀️';

  // ★ 時刻（HH:MM）
  let displayTime = u.localTime || '';
  if (!displayTime && u.timestamp && u.timestamp.toDate) {
    const t = u.timestamp.toDate();
    displayTime = String(t.getHours()).padStart(2,'0') + ':' + String(t.getMinutes()).padStart(2,'0');
  }

  // ★ 月日（M/D）— localDate がなければ timestamp から生成
  let displayDate = u.localDate || '';
  if (!displayDate && u.timestamp && u.timestamp.toDate) {
    const t = u.timestamp.toDate();
    displayDate = (t.getMonth() + 1) + '/' + t.getDate();
  }

  // 達成バッジ
  let achievementBadge = '';
  if (u.isOnTime === true) {
    achievementBadge = '<span class="card-achieve-badge achieved">🔴 目標達成</span>';
  } else if (u.isOnTime === false) {
    achievementBadge = '<span class="card-achieve-badge missed">🔵 次頑張ろう</span>';
  }

  const card = document.createElement('div');
  card.className = `status-card ${stateClass}`;
  card.innerHTML = `
    <div class="card-top">
      <span class="card-status-badge ${stateClass}">
        <span class="status-dot ${stateClass}"></span>
        ${badgeLabel}
      </span>
    </div>
    <div class="card-avatar-row">
      <div class="card-avatar ${stateClass}">${escapeHtml(u.displayName.charAt(0))}</div>
      <span class="card-name">${escapeHtml(u.displayName)}</span>
    </div>
    <div class="card-datetime-block">
      <span class="card-date-label">${timeIcon} ${escapeHtml(timeLabel)}</span>
      <div class="card-datetime-row">
        <span class="card-time-value ${stateClass}">${escapeHtml(displayTime)}</span>
        ${displayDate ? `<span style="font-size:0.78rem;color:var(--text-2);margin-left:0.25rem;">${escapeHtml(displayDate)}</span>` : ''}
      </div>
    </div>
    ${achievementBadge}
  `;
  return card;
}

function escapeHtml(s) {
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

// ============================================================
//  USERS 購読 → 目標時間テーブル（NEW）
// ============================================================
function subscribeUsers() {
  if (unsubUsers) unsubUsers();

  unsubUsers = db.collection('users').onSnapshot((snapshot) => {
    const users = [];
    snapshot.forEach((doc) => {
      const d = doc.data();
      users.push({
        uid: doc.id,
        displayName: d.displayName || 'ユーザー',
        goalSleep: d.goalSleep || null,
        goalWake:  d.goalWake  || null
      });
    });
    users.sort((a, b) => a.displayName.localeCompare(b.displayName, 'ja'));
    renderGoalsTable(users);
  }, (err) => {
    console.error(err);
  });
}

function renderGoalsTable(users) {
  const tbody = document.getElementById('goals-table-body');
  tbody.innerHTML = '';

  if (users.length === 0) {
    tbody.innerHTML = '<tr><td colspan="3"><div class="goals-empty">メンバーがいません</div></td></tr>';
    return;
  }

  users.forEach((u) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>
        <div class="gt-name">
          <div class="gt-avatar">${escapeHtml(u.displayName.charAt(0))}</div>
          <span>${escapeHtml(u.displayName)}</span>
        </div>
      </td>
      <td>
        ${u.goalSleep
          ? `<span class="gt-time sleep">${escapeHtml(u.goalSleep)}</span>`
          : `<span class="gt-unset">未設定</span>`}
      </td>
      <td>
        ${u.goalWake
          ? `<span class="gt-time wake">${escapeHtml(u.goalWake)}</span>`
          : `<span class="gt-unset">未設定</span>`}
      </td>
    `;
    tbody.appendChild(tr);
  });
}

// ============================================================
//  SETTINGS
// ============================================================
function updateGoalDisplay() {
  document.getElementById('goal-sleep-display').textContent = userProfile.goalSleep || '未設定';
  document.getElementById('goal-wake-display').textContent = userProfile.goalWake || '未設定';
}

async function saveSettings() {
  if (!currentUser) return;
  const name = document.getElementById('display-name-input').value.trim();
  const goalSleep = document.getElementById('goal-sleep-input').value;
  const goalWake = document.getElementById('goal-wake-input').value;
  if (!name) return showToast('表示名を入力してください');

  await db.collection('users').doc(currentUser.uid).set({
    displayName: name,
    goalSleep,
    goalWake
  }, { merge: true });

  userProfile = { ...userProfile, displayName: name, goalSleep, goalWake };
  document.getElementById('user-name-display').textContent = name;
  document.getElementById('user-avatar').textContent = name.charAt(0);
  updateGoalDisplay();

  const msg = document.getElementById('save-msg');
  msg.style.display = 'inline';
  setTimeout(() => { msg.style.display = 'none'; }, 2500);
}

// ============================================================
//  TAB NAVIGATION
// ============================================================
function switchTab(name, btnEl) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  if (btnEl) btnEl.classList.add('active');
}

// ============================================================
//  TOAST
// ============================================================
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}
</script>
