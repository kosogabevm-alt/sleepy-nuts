<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ゴミ箱アーケード</title>
<style>
  /* ============ tokens — one committed world: a night arcade hall ============ */
  :root {
    --bg: #0b0f0d;
    --bg-2: #10160f;
    --hall-vignette: rgba(0,0,0,0.55);

    --metal: #3c4a42;
    --metal-hi: #5c7166;
    --metal-lo: #212a24;

    --neon: #5dffb1;
    --neon-dim: #2c8f66;
    --gold: #ffcb3d;
    --gold-2: #ff9a3d;
    --ember: #ff5d3d;

    --ink: #eef6f0;
    --ink-dim: #9db3a7;
    --ink-faint: #647a70;

    --screen-bg: #06120c;

    --radius-lg: 28px;
    --radius-md: 16px;
    --radius-sm: 10px;

    --font-display: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Noto Sans JP", system-ui, sans-serif;
    --font-body: "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", system-ui, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ambient hall backdrop: soft radial glow + vignette + faint floor grid */
  .hall {
    position: relative;
    min-height: 100vh;
    padding: 3rem 1.25rem 4rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2.5rem;
    background:
      radial-gradient(ellipse 60% 40% at 50% 18%, rgba(93,255,177,0.10), transparent 60%),
      radial-gradient(ellipse 80% 60% at 50% 100%, rgba(255,203,61,0.06), transparent 65%),
      linear-gradient(var(--bg-2), var(--bg) 55%);
  }
  .hall::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    box-shadow: inset 0 0 18vw var(--hall-vignette);
  }

  /* ============ marquee ============ */
  .marquee { position: relative; z-index: 1; width: 100%; display: flex; justify-content: center; }
  .marquee-frame {
    position: relative;
    padding: 1.1rem 2.2rem 1.3rem;
    border-radius: var(--radius-md);
    background: linear-gradient(180deg, #16201a, #0e1510);
    border: 1px solid rgba(93,255,177,0.25);
    box-shadow:
      0 0 0 1px rgba(0,0,0,0.4),
      0 18px 40px -20px rgba(0,0,0,0.8),
      0 0 40px -10px rgba(93,255,177,0.25);
    text-align: center;
    max-width: 92vw;
  }
  .bulb-row {
    display: flex;
    justify-content: center;
    gap: 0.5rem;
    margin-bottom: 0.6rem;
  }
  .bulb {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 6px 1px var(--gold);
    animation: twinkle 2.4s ease-in-out infinite;
  }
  .bulb:nth-child(odd) { animation-delay: -1.2s; }
  .bulb:nth-child(3n) { background: var(--neon); box-shadow: 0 0 6px 1px var(--neon); }
  @keyframes twinkle { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }

  .marquee-title {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 900;
    font-size: clamp(1.7rem, 5vw, 2.6rem);
    letter-spacing: 0.03em;
    color: var(--ink);
    text-shadow:
      0 1px 0 var(--gold-2),
      0 2px 0 var(--gold-2),
      0 3px 0 #b5651d,
      0 4px 10px rgba(0,0,0,0.6),
      0 0 26px rgba(93,255,177,0.35);
  }
  .marquee-sub {
    margin: 0.5rem 0 0;
    font-size: 0.9rem;
    color: var(--ink-dim);
    letter-spacing: 0.02em;
  }

  /* ============ stage layout ============ */
  .stage {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 980px;
    display: grid;
    grid-template-columns: minmax(280px, 360px) 1fr;
    gap: 2rem;
    align-items: start;
  }
  @media (max-width: 760px) {
    .stage { grid-template-columns: 1fr; justify-items: center; }
  }

  /* ============ cabinet ============ */
  .cabinet {
    position: relative;
    width: 100%;
    max-width: 360px;
    justify-self: center;
  }
  .cabinet-lid {
    position: relative;
    height: 34px;
    margin: 0 6%;
    border-radius: 18px 18px 6px 6px;
    background: linear-gradient(180deg, var(--metal-hi), var(--metal));
    border: 1px solid rgba(0,0,0,0.35);
    box-shadow: 0 6px 10px -6px rgba(0,0,0,0.6);
  }
  .slot {
    position: absolute;
    top: 8px; left: 50%;
    width: 84px; height: 14px;
    transform: translateX(-50%);
    background: var(--screen-bg);
    border-radius: 8px;
    box-shadow: inset 0 3px 5px rgba(0,0,0,0.8);
  }

  .cabinet-body {
    position: relative;
    margin-top: -6px;
    padding: 1.1rem 1rem 1.4rem;
    border-radius: 20px 20px 40px 40px;
    background:
      repeating-linear-gradient(180deg, rgba(0,0,0,0.12) 0 2px, transparent 2px 10px),
      linear-gradient(180deg, var(--metal-hi) 0%, var(--metal) 18%, var(--metal) 78%, var(--metal-lo) 100%);
    border: 1px solid rgba(0,0,0,0.4);
    box-shadow:
      0 24px 40px -22px rgba(0,0,0,0.8),
      inset 0 1px 0 rgba(255,255,255,0.08);
    min-height: 300px;
    overflow: hidden;
  }

  .screen {
    background: var(--screen-bg);
    border-radius: var(--radius-sm);
    padding: 0.6rem 0.8rem;
    border: 1px solid rgba(93,255,177,0.2);
    box-shadow: inset 0 0 14px rgba(0,0,0,0.7), 0 0 18px -6px rgba(93,255,177,0.4);
    display: flex;
    justify-content: space-between;
    gap: 0.5rem;
  }
  .screen-item { display: flex; flex-direction: column; gap: 0.15rem; }
  .screen-label {
    font-family: var(--font-mono);
    font-size: 0.62rem;
    letter-spacing: 0.12em;
    color: var(--neon-dim);
  }
  .screen-value {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 1.15rem;
    color: var(--neon);
    text-shadow: 0 0 8px rgba(93,255,177,0.7);
  }
  .screen-value .unit { font-size: 0.65rem; color: var(--neon-dim); margin-left: 2px; }

  .chute-stage {
    position: relative;
    height: 190px;
    margin-top: 0.9rem;
    border-radius: var(--radius-sm);
    background: radial-gradient(ellipse at 50% 0%, rgba(255,203,61,0.08), transparent 55%);
    overflow: hidden;
  }
  .chute-mouth {
    position: absolute;
    top: 0; left: 50%;
    width: 30px; height: 10px;
    transform: translateX(-50%);
    background: var(--metal-lo);
    border-radius: 0 0 8px 8px;
  }
  .fx-canvas { position: absolute; inset: 0; pointer-events: none; }

  .ball {
    position: absolute;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: radial-gradient(circle at 32% 28%, #fff6d8, var(--gold) 55%, #b8781a 100%);
    box-shadow: 0 0 8px rgba(255,203,61,0.6), 0 2px 3px rgba(0,0,0,0.5);
    transform: translate(-50%, -50%);
    z-index: 2;
  }

  .tray {
    position: relative;
    margin-top: 0.4rem;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
    padding: 0.6rem;
    border-radius: var(--radius-sm);
    background: linear-gradient(180deg, var(--metal-lo), #171f1a);
    box-shadow: inset 0 4px 8px rgba(0,0,0,0.6);
  }
  .pocket {
    height: 34px;
    border-radius: 8px;
    background: var(--screen-bg);
    box-shadow: inset 0 3px 6px rgba(0,0,0,0.85);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-mono);
    font-size: 0.58rem;
    letter-spacing: 0.06em;
    color: var(--ink-faint);
    position: relative;
  }
  .pocket.jackpot {
    color: var(--gold);
    box-shadow: inset 0 3px 6px rgba(0,0,0,0.85), 0 0 12px -2px rgba(255,203,61,0.7);
    border: 1px solid rgba(255,203,61,0.5);
  }
  .pocket .pip {
    position: absolute; bottom: 3px; width: 6px; height: 6px; border-radius: 50%;
    background: var(--gold); box-shadow: 0 0 4px var(--gold);
  }

  /* ============ control panel ============ */
  .panel {
    background: linear-gradient(180deg, #131b16, #0d130f);
    border: 1px solid rgba(93,255,177,0.12);
    border-radius: var(--radius-lg);
    padding: 1.4rem 1.4rem 1.6rem;
    box-shadow: 0 20px 40px -26px rgba(0,0,0,0.8);
  }
  .panel h2 {
    margin: 0 0 0.2rem;
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 1.05rem;
    letter-spacing: 0.01em;
  }
  .panel .lead {
    margin: 0 0 1rem;
    color: var(--ink-dim);
    font-size: 0.85rem;
    line-height: 1.6;
  }

  .item-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(104px, 1fr));
    gap: 0.6rem;
    margin-bottom: 1.2rem;
  }
  .trash-btn {
    all: unset;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.3rem;
    padding: 0.75rem 0.4rem;
    border-radius: var(--radius-sm);
    background: linear-gradient(180deg, #1c2620, #131c17);
    border: 1px solid rgba(255,255,255,0.06);
    text-align: center;
    transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .trash-btn:hover { border-color: rgba(93,255,177,0.4); box-shadow: 0 0 16px -6px rgba(93,255,177,0.5); }
  .trash-btn:active { transform: translateY(2px) scale(0.98); }
  .trash-btn:focus-visible { outline: 2px solid var(--neon); outline-offset: 2px; }
  .trash-btn .emoji { font-size: 1.5rem; line-height: 1; }
  .trash-btn .name { font-size: 0.78rem; color: var(--ink); }
  .trash-btn .weight { font-family: var(--font-mono); font-size: 0.68rem; color: var(--gold); }

  .score-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.8rem;
    padding: 0.8rem 0.9rem;
    border-radius: var(--radius-sm);
    background: rgba(255,203,61,0.06);
    border: 1px solid rgba(255,203,61,0.18);
    margin-bottom: 1.2rem;
  }
  .score-label { display: block; font-size: 0.68rem; letter-spacing: 0.08em; color: var(--ink-dim); }
  .score-value {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 1.5rem;
    color: var(--gold);
    text-shadow: 0 0 10px rgba(255,203,61,0.5);
  }
  .reset-btn {
    all: unset;
    cursor: pointer;
    font-size: 0.75rem;
    padding: 0.5rem 0.9rem;
    border-radius: 999px;
    border: 1px solid var(--ink-faint);
    color: var(--ink-dim);
  }
  .reset-btn:hover { border-color: var(--ink); color: var(--ink); }
  .reset-btn:focus-visible { outline: 2px solid var(--neon); outline-offset: 2px; }

  .rule-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.78rem;
    margin-bottom: 1rem;
  }
  .rule-table caption {
    text-align: left;
    font-size: 0.68rem;
    letter-spacing: 0.1em;
    color: var(--ink-faint);
    margin-bottom: 0.4rem;
  }
  .rule-table th, .rule-table td {
    text-align: left;
    padding: 0.35rem 0.5rem;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    color: var(--ink-dim);
  }
  .rule-table th { color: var(--ink-faint); font-weight: 500; font-size: 0.68rem; letter-spacing: 0.06em; }
  .rule-table td:last-child, .rule-table th:last-child { color: var(--gold); font-family: var(--font-mono); }

  .hint {
    margin: 0;
    font-size: 0.78rem;
    line-height: 1.6;
    color: var(--ink-dim);
  }

  @media (prefers-reduced-motion: reduce) {
    .bulb { animation: none; opacity: 0.8; }
    * { scroll-behavior: auto !important; }
  }
</style>
</head>
<body>
<div class="hall">

  <div class="marquee">
    <div class="marquee-frame">
      <div class="bulb-row" aria-hidden="true">
        <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span>
        <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span>
        <span class="bulb"></span>
      </div>
      <h1 class="marquee-title">ゴミ箱アーケード</h1>
      <p class="marquee-sub">重さがそのままメダルになる、捨てるほど盛り上がる筐体。</p>
    </div>
  </div>

  <div class="stage">
    <div class="cabinet" aria-hidden="false">
      <div class="cabinet-lid">
        <div class="slot" id="slot"></div>
      </div>
      <div class="cabinet-body">
        <div class="screen">
          <div class="screen-item">
            <span class="screen-label">WEIGHT</span>
            <span class="screen-value" id="weightReadout">0<span class="unit">g</span></span>
          </div>
          <div class="screen-item" style="align-items:flex-end;">
            <span class="screen-label">PAYOUT</span>
            <span class="screen-value" id="medalReadout">0<span class="unit">枚</span></span>
          </div>
        </div>

        <div class="chute-stage" id="chuteStage">
          <div class="chute-mouth"></div>
          <canvas class="fx-canvas" id="fx"></canvas>
        </div>

        <div class="tray" id="tray">
          <div class="pocket" data-slot="0"></div>
          <div class="pocket" data-slot="1"></div>
          <div class="pocket jackpot" data-slot="2">JACKPOT</div>
          <div class="pocket" data-slot="3"></div>
          <div class="pocket" data-slot="4"></div>
        </div>
      </div>
    </div>

    <aside class="panel">
      <h2>ゴミを投入する</h2>
      <p class="lead">重ければ重いほど、たくさんのメダルが飛び出す。トレイに落ちるたび花火が上がる。</p>

      <div class="item-grid">
        <button class="trash-btn" data-weight="30" data-emoji="🥫">
          <span class="emoji">🥫</span><span class="name">空き缶</span><span class="weight">30g</span>
        </button>
        <button class="trash-btn" data-weight="150" data-emoji="🍱">
          <span class="emoji">🍱</span><span class="name">弁当がら</span><span class="weight">150g</span>
        </button>
        <button class="trash-btn" data-weight="500" data-emoji="🧴">
          <span class="emoji">🧴</span><span class="name">ペットボトル</span><span class="weight">500g</span>
        </button>
        <button class="trash-btn" data-weight="900" data-emoji="📰">
          <span class="emoji">📰</span><span class="name">新聞紙束</span><span class="weight">900g</span>
        </button>
        <button class="trash-btn" data-weight="1500" data-emoji="📦">
          <span class="emoji">📦</span><span class="name">段ボール</span><span class="weight">1.5kg</span>
        </button>
      </div>

      <div class="score-row">
        <div>
          <span class="score-label">獲得メダル合計</span>
          <span class="score-value" id="scoreTotal">0</span>
        </div>
        <button class="reset-btn" id="resetBtn">リセット</button>
      </div>

      <table class="rule-table">
        <caption>換算ルール — メダル数 = 重さ ÷ 150g（切り上げ・上限10枚）</caption>
        <thead><tr><th>ゴミの重さ</th><th>排出メダル</th></tr></thead>
        <tbody>
          <tr><td>〜150g</td><td>1枚</td></tr>
          <tr><td>500g</td><td>4枚</td></tr>
          <tr><td>900g</td><td>6枚</td></tr>
          <tr><td>1.5kg〜</td><td>10枚（上限）</td></tr>
        </tbody>
      </table>

      <p class="hint">メダルがJACKPOTポケットに入ると、特大の花火が上がります。</p>
    </aside>
  </div>
</div>

<script>
(function () {
  "use strict";

  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var slotEl = document.getElementById("slot");
  var chuteStage = document.getElementById("chuteStage");
  var trayEl = document.getElementById("tray");
  var fxCanvas = document.getElementById("fx");
  var ctx = fxCanvas.getContext("2d");
  var weightReadout = document.getElementById("weightReadout");
  var medalReadout = document.getElementById("medalReadout");
  var scoreTotalEl = document.getElementById("scoreTotal");
  var resetBtn = document.getElementById("resetBtn");
  var buttons = document.querySelectorAll(".trash-btn");
  var pockets = trayEl.querySelectorAll(".pocket");

  var scoreTotal = 0;

  // ---------- canvas sizing ----------
  function fitCanvas() {
    var rect = chuteStage.getBoundingClientRect();
    var dpr = window.devicePixelRatio || 1;
    fxCanvas.width = rect.width * dpr;
    fxCanvas.height = rect.height * dpr;
    fxCanvas.style.width = rect.width + "px";
    fxCanvas.style.height = rect.height + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  fitCanvas();
  window.addEventListener("resize", fitCanvas);

  // ---------- firework particle system ----------
  var particles = [];
  var rafId = null;

  function spawnFirework(x, y, big) {
    var count = big ? 46 : 20;
    var palette = big
      ? ["#ffcb3d", "#ff9a3d", "#ff5d3d", "#5dffb1"]
      : ["#ffcb3d", "#5dffb1"];
    for (var i = 0; i < count; i++) {
      var angle = (Math.PI * 2 * i) / count + Math.random() * 0.3;
      var speed = (big ? 2.4 : 1.6) + Math.random() * (big ? 2.2 : 1.4);
      particles.push({
        x: x, y: y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 1,
        decay: 0.012 + Math.random() * 0.015,
        size: big ? 2.4 + Math.random() * 1.6 : 1.6 + Math.random() * 1.2,
        color: palette[Math.floor(Math.random() * palette.length)]
      });
    }
    if (!rafId) rafId = requestAnimationFrame(tick);
  }

  function tick() {
    var rect = chuteStage.getBoundingClientRect();
    ctx.clearRect(0, 0, rect.width, rect.height);
    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.045; // gravity
      p.vx *= 0.985;
      p.life -= p.decay;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      ctx.globalAlpha = Math.max(p.life, 0);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    if (particles.length > 0) {
      rafId = requestAnimationFrame(tick);
    } else {
      rafId = null;
    }
  }

  // ---------- ball drop ----------
  var pocketWeights = [1, 2, 3, 2, 1]; // center pocket (jackpot) most likely

  function pickPocketIndex() {
    var total = pocketWeights.reduce(function (a, b) { return a + b; }, 0);
    var r = Math.random() * total;
    for (var i = 0; i < pocketWeights.length; i++) {
      if (r < pocketWeights[i]) return i;
      r -= pocketWeights[i];
    }
    return 2;
  }

  function dropBall(delay) {
    setTimeout(function () {
      var stageRect = chuteStage.getBoundingClientRect();
      var pocketIndex = pickPocketIndex();
      var pocket = pockets[pocketIndex];
      var pocketRect = pocket.getBoundingClientRect();
      var trayRect = trayEl.getBoundingClientRect();

      var startXPct = 50;
      var endXPct = ((pocketRect.left + pocketRect.width / 2 - stageRect.left) / stageRect.width) * 100;

      var ball = document.createElement("div");
      ball.className = "ball";
      ball.style.left = startXPct + "%";
      ball.style.top = "0%";
      chuteStage.appendChild(ball);

      var duration = reduceMotion ? 1 : 620 + Math.random() * 180;
      var anim = ball.animate(
        [
          { top: "0%", left: startXPct + "%", transform: "translate(-50%,-50%) rotate(0deg)", offset: 0 },
          { top: "55%", left: (startXPct + endXPct) / 2 + "%", transform: "translate(-50%,-50%) rotate(220deg)", offset: 0.55 },
          { top: "92%", left: endXPct + "%", transform: "translate(-50%,-50%) rotate(400deg)", offset: 1 }
        ],
        { duration: duration, easing: "cubic-bezier(.45,0,.8,.35)", fill: "forwards" }
      );

      anim.onfinish = function () {
        ball.remove();
        var isJackpot = pocket.classList.contains("jackpot");
        var fxX = pocketRect.left + pocketRect.width / 2 - stageRect.left;
        var fxY = stageRect.height - 6;
        spawnFirework(fxX, fxY, isJackpot);

        var pip = document.createElement("span");
        pip.className = "pip";
        pip.style.left = 8 + Math.random() * (pocketRect.width - 16) + "px";
        pocket.appendChild(pip);
        while (pocket.querySelectorAll(".pip").length > 6) {
          pocket.removeChild(pocket.querySelector(".pip"));
        }

        scoreTotal += isJackpot ? 3 : 1;
        scoreTotalEl.textContent = scoreTotal;
      };
    }, delay);
  }

  // ---------- throw trash ----------
  function medalsForWeight(g) {
    return Math.max(1, Math.min(10, Math.ceil(g / 150)));
  }

  function throwTrash(btn) {
    var weight = parseInt(btn.getAttribute("data-weight"), 10);
    var emoji = btn.getAttribute("data-emoji");
    var medals = medalsForWeight(weight);

    // flying trash icon: button -> slot
    var btnRect = btn.getBoundingClientRect();
    var slotRect = slotEl.getBoundingClientRect();
    var flyer = document.createElement("div");
    flyer.textContent = emoji;
    flyer.style.position = "fixed";
    flyer.style.left = btnRect.left + btnRect.width / 2 + "px";
    flyer.style.top = btnRect.top + btnRect.height / 2 + "px";
    flyer.style.fontSize = "1.4rem";
    flyer.style.zIndex = "50";
    flyer.style.pointerEvents = "none";
    flyer.style.transform = "translate(-50%,-50%)";
    document.body.appendChild(flyer);

    var duration = reduceMotion ? 1 : 420;
    var flight = flyer.animate(
      [
        { left: btnRect.left + btnRect.width / 2 + "px", top: btnRect.top + btnRect.height / 2 + "px", opacity: 1 },
        { left: slotRect.left + slotRect.width / 2 + "px", top: slotRect.top + slotRect.height / 2 + "px", opacity: 0.3, offset: 0.9 },
        { left: slotRect.left + slotRect.width / 2 + "px", top: slotRect.top + slotRect.height / 2 + "px", opacity: 0 }
      ],
      { duration: duration, easing: "ease-in" }
    );

    flight.onfinish = function () {
      flyer.remove();
      weightReadout.innerHTML = weight + '<span class="unit">g</span>';
      medalReadout.innerHTML = medals + '<span class="unit">枚</span>';
      for (var i = 0; i < medals; i++) {
        dropBall(i * (reduceMotion ? 0 : 90));
      }
    };
  }

  buttons.forEach(function (btn) {
    btn.addEventListener("click", function () { throwTrash(btn); });
  });

  resetBtn.addEventListener("click", function () {
    scoreTotal = 0;
    scoreTotalEl.textContent = "0";
    weightReadout.innerHTML = '0<span class="unit">g</span>';
    medalReadout.innerHTML = '0<span class="unit">枚</span>';
    trayEl.querySelectorAll(".pip").forEach(function (p) { p.remove(); });
  });
})();
</script>
</body>
</html>
